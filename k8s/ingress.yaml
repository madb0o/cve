apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cve-dashboard
  namespace: cve-dashboard
spec:
  ingressClassName: traefik
  rules:
  - host: cve.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cve-dashboard
            port:
              number: 80
